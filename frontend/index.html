<!doctype html>
<html lang="vi" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1015" />
    <meta name="description" content="Dịch EPUB và đọc sách đã dịch: mục lục, tìm kiếm, ghi chú, TTS và nhạc nền." />
    <link rel="manifest" href="/v2/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/v2/favicon.svg" />
    <link rel="apple-touch-icon" href="/v2/icon-192.png" />
    <title>Translate Book Manager · v2</title>
    <script>
      (function () {
        var names = ["light", "sepia", "dark", "black", "system", "custom"];
        var saved = null;
        try { saved = localStorage.getItem("theme"); } catch (e) {}
        if (names.indexOf(saved) < 0) saved = "system";
        var light = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
        var resolved = saved === "system" ? (light ? "light" : "dark") : saved;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = (resolved === "light" || resolved === "sepia") ? "light" : "dark";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
