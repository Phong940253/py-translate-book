{# Inline SVG icon set (no CDN -- the UI is local-only). Usage: #}
{#   {% from "_icons.html" import icon %}                                   #}
{#   {{ icon('dashboard') }}  or  {{ icon('plus', 'icon-sm') }}            #}
{% macro icon(name, cls="") %}
  <svg class="icon {{ cls }}" viewBox="0 0 24 24" width="18" height="18"
       fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    {% if name == 'dashboard' %}
      <path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/>
    {% elif name == 'plus' %}
      <path d="M12 5v14M5 12h14"/>
    {% elif name == 'books' %}
      <path d="M4 4h6v16H4zM14 4h6v16h-6z"/>
    {% elif name == 'gear' %}
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    {% elif name == 'image' %}
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <circle cx="9" cy="9" r="2"/>
      <path d="M21 15l-5-5L5 21"/>
    {% elif name == 'play' %}
      <polygon points="6 4 20 12 6 20 6 4"/>
    {% elif name == 'stop' %}
      <rect x="6" y="6" width="12" height="12" rx="2"/>
    {% elif name == 'retry' %}
      <path d="M23 4v6h-6M1 20v-6h6"/>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
    {% elif name == 'refresh' %}
      <path d="M23 4v6h-6M1 20v-6h6"/>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
    {% elif name == 'download' %}
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
    {% elif name == 'check' %}
      <path d="M20 6L9 17l-5-5"/>
    {% elif name == 'warn' %}
      <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
      <path d="M12 9v4M12 17h.01"/>
    {% elif name == 'alert' %}
      <circle cx="12" cy="12" r="10"/>
      <path d="M12 8v4M12 16h.01"/>
    {% elif name == 'x' %}
      <path d="M18 6 6 18M6 6l12 12"/>
    {% elif name == 'search' %}
      <circle cx="11" cy="11" r="8"/>
      <path d="M21 21l-4.35-4.35"/>
    {% elif name == 'save' %}
      <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
      <polyline points="17 21 17 13 7 13 7 21"/>
      <polyline points="7 3 7 8 15 8"/>
    {% elif name == 'key' %}
      <circle cx="7.5" cy="15.5" r="4.5"/>
      <path d="M10.7 12.3 21 2M15 8l3 3M18 5l2 2"/>
    {% elif name == 'bell' %}
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    {% elif name == 'sun' %}
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
    {% elif name == 'moon' %}
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    {% elif name == 'chevron-right' %}
      <path d="M9 18l6-6-6-6"/>
    {% elif name == 'chevron-left' %}
      <path d="M15 18l-6-6 6-6"/>
    {% elif name == 'book' %}
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
    {% else %}
      <circle cx="12" cy="12" r="9"/>
    {% endif %}
  </svg>
{% endmacro %}
