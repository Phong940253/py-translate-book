<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Translate Book Manager{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <div class="brand">{% from "_icons.html" import icon %}{{ icon('books') }} Translate Book Manager</div>
    <nav>
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">{{ icon('dashboard') }} Dashboard</a>
      <a href="{{ url_for('job_new') }}" class="{{ 'active' if request.endpoint == 'job_new' }}">{{ icon('plus') }} Job mới</a>
      <a href="{{ url_for('books') }}" class="{{ 'active' if request.endpoint == 'books' }}">{{ icon('books') }} Thư viện</a>
      <a href="{{ url_for('config_view') }}" class="{{ 'active' if request.endpoint == 'config_view' }}">{{ icon('gear') }} Cấu hình</a>
      <a href="{{ url_for('illustrations') }}" class="{{ 'active' if request.endpoint == 'illustrations' }}">{{ icon('image') }} Ảnh</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <small>Local only · 127.0.0.1:5000</small>
  </footer>
</body>
</html>
